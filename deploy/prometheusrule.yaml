# deploy/prometheusrule.yaml
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: controlmyspa-porssari
  labels:
    app: controlmyspa-porssari
spec:
  groups:
    - name: controlmyspa-porssari-infra
      rules:
        # If kube-state-metrics is not visible to the Prometheus that
        # evaluates this rule, every other rule in this group is dead code
        # that will never fire. absent() makes that fact page us once,
        # instead of hiding as silence. Delete this rule once it has stayed
        # quiet for a day.
        - alert: SpaMetricsSourceMissing
          expr: absent(kube_deployment_status_replicas_available{deployment="controlmyspa-porssari"})
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "kube_deployment_status_replicas_available is not visible here, so the infra alerts cannot fire"

        - alert: SpaControllerDown
          expr: kube_deployment_status_replicas_available{deployment="controlmyspa-porssari"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "The spa controller has no available replica, so the spa is not being controlled"

        - alert: SpaControllerRestartLooping
          expr: increase(kube_pod_container_status_restarts_total{container="controlmyspa-porssari"}[15m]) > 2
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Pod {{ $labels.pod }} is restart-looping"

        - alert: SpaControllerOOMKilled
          # kube_pod_container_status_last_state_terminated_reason describes the
          # LAST terminated state of the container within the pod object. After
          # an OOM kill the container restarts, the pod object survives, and
          # this series stays at 1 for the rest of the pod's life. Bounding it
          # to a restart in the last 15m stops it from re-firing every
          # repeatInterval forever after a single OOM kill. Do not simplify
          # this back to the bare "last_state" check.
          expr: increase(kube_pod_container_status_restarts_total{container="controlmyspa-porssari"}[15m]) > 0 and on(pod) kube_pod_container_status_last_state_terminated_reason{container="controlmyspa-porssari", reason="OOMKilled"} == 1
          labels:
            severity: critical
          annotations:
            summary: "Pod {{ $labels.pod }} was OOM-killed"

        - alert: SpaControllerNotReady
          expr: kube_pod_status_ready{pod=~"controlmyspa-porssari.*", condition="false"} > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ $labels.pod }} has not been ready for 10 minutes"

    # Metrics the app exports about the spa itself. The group above only knows
    # whether the pod runs; a pod that runs but cannot reach the spa looks
    # healthy to it, which is how a week without readings went unnoticed.
    - name: controlmyspa-porssari-spa
      rules:
        # Same reasoning as SpaMetricsSourceMissing: if the ServiceMonitor is
        # not working, silence would look identical to health.
        - alert: SpaMetricsNotScraped
          expr: absent(spa_api_last_success_timestamp_seconds)
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "The spa metrics endpoint is not being scraped, so no spa alert can fire"

        # A fact, not an inference: the control loop runs every 15 minutes, so
        # six hours without a successful read means the API or the gateway is
        # gone for good. 6h, not 1h, because Balboa is down for under an hour
        # several times a month and fixes itself; July 13 to September 15 held
        # one 5.2h gap and the week-long 404. The pool loses under 2 C in six
        # hours at the low setpoint. The app seeds this gauge from SQLite on
        # startup, so a restart neither resets the clock nor hides an outage
        # that spans it.
        - alert: SpaApiUnreachable
          expr: time() - spa_api_last_success_timestamp_seconds > 21600
          labels:
            severity: critical
          annotations:
            summary: "No successful ControlMySpa read for {{ $value | humanizeDuration }}"

        # The API can answer while the gateway behind it is dead, returning the
        # same value forever. 12h because a pool holding at setpoint legitimately
        # sits in one 0.5 C bucket for hours.
        #
        # Every pod restart starts a new series (the pod label changes), and
        # changes() over a 30-minute-old series is 0, so the series are merged
        # first and 12h of data are required (144 steps, one hour of gaps
        # tolerated). Only while reads succeed: during an API outage the gauge
        # is frozen too, and SpaApiUnreachable already says so.
        - alert: SpaReadingFrozen
          expr: >
            changes(max(spa_pool_temperature_celsius)[12h:5m]) == 0
            and on() count_over_time(max(spa_pool_temperature_celsius)[12h:5m]) > 132
            and on() time() - max(spa_api_last_success_timestamp_seconds) < 3600
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Pool temperature has not moved in 12 hours, the gateway may be stuck"

        # 33 rather than TEMP_MIN (34), so a single sensor tick below the
        # target does not page.
        - alert: SpaTooCold
          expr: spa_pool_temperature_celsius < 33
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Pool is at {{ $value }} C, below TEMP_MIN, and has not recovered in an hour"

        # min_over_time says nothing about how much data its window holds, so
        # the bare min_over_time(...[24h]) > 0 fired minutes after a pod was
        # recreated: a new pod label starts a new series, every sample of a
        # two-hour-old series is positive, and the alert claimed 24 hours.
        # Same reasoning as SpaReadingFrozen -- count the steps the window
        # actually covers and require nearly all of them.
        #
        # 25h rather than 24h because /heat books a deliberate 24-hour
        # override, and a 24h window goes positive at the exact moment that
        # legitimate override expires. 289 of the 300 five-minute steps
        # tolerates an hour of scrape gaps.
        - alert: SpaOverrideLeftOn
          expr: >
            min_over_time(spa_manual_override_seconds_remaining[25h:5m]) > 0
            and count_over_time(spa_manual_override_seconds_remaining[25h:5m]) > 289
          labels:
            severity: info
          annotations:
            summary: "Manual override has been continuously active for more than a day"

        # 3h because the horizon is legitimately short just before the 14:00
        # publication of tomorrow's prices.
        - alert: SpaPricesStale
          expr: spa_price_hours_known < 4
          for: 3h
          labels:
            severity: warning
          annotations:
            summary: "Fewer than 4 future hours have a known price, spot-hinta may be failing"
